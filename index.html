<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dependency Tree</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <header>
      <h1>Dependency Tree</h1>
      <p>Prototype, Step 0A: moments only, from a small hand-made sample.</p>
    </header>
    <main>
      <section id="moment-card" aria-labelledby="moment-name">
        <h2 id="moment-name"></h2>
        <div class="card-part">
          <label for="moment-summary">Summary</label>
          <textarea id="moment-summary" readonly rows="3"></textarea>
        </div>
        <div class="card-part">
          <label for="moment-description">Description</label>
          <textarea id="moment-description" readonly rows="4"></textarea>
        </div>
        <!-- The list comes before the tabs, so Tab reaches the list first.
             The stylesheet still shows the tabs above the list. -->
        <div class="card-part relationships">
          <div id="relationship-panel"></div>
          <div id="relationship-tabs" role="tablist" aria-label="Relationships"></div>
        </div>
        <button type="button" id="help-open">Keyboard help</button>
      </section>
    </main>
    <div id="announcer" class="visually-hidden" aria-live="assertive" aria-atomic="true"></div>
    <dialog id="help" aria-labelledby="help-heading">
      <h2 id="help-heading">Keyboard help</h2>
      <div id="help-content"></div>
      <button type="button" id="help-close">Close</button>
    </dialog>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
